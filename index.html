<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10101d">
    <meta name="description" content="落として、くっつけて、神まで進化。無限ガチャ合体。">
    <title>無限ガチャ合体</title>
    <link rel="stylesheet" href="style.css?v=2">
  </head>
  <body>
    <main class="game-shell" aria-label="無限ガチャ合体">
      <canvas id="game" aria-label="タップした位置に玉を落とすゲーム"></canvas>

      <section id="start-screen" class="screen" aria-labelledby="game-title">
        <div class="screen-card start-card">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="eyebrow">落として、合体。どこまでも。</p>
          <h1 id="game-title">無限ガチャ<br><span>合体</span></h1>
          <p class="how-to">タップした場所に落とすだけ<br>同じ玉が触れると進化！</p>
          <button id="start-button" class="primary-button" type="button">今すぐ合体 <span aria-hidden="true">→</span></button>
          <p class="tiny-note">ひと息で、神まで。</p>
        </div>
      </section>

      <section id="end-screen" class="screen is-hidden" aria-labelledby="end-title" aria-live="polite">
        <div class="screen-card end-card">
          <p class="eyebrow">今回はここまで</p>
          <h2 id="end-title">合体終了</h2>
          <div class="final-score"><span>スコア</span><strong id="final-score">0</strong></div>
          <div class="best-line">自己ベスト <strong id="final-best">0</strong></div>
          <button id="restart-button" class="primary-button" type="button">もう1回 <span aria-hidden="true">↻</span></button>
          <p class="tiny-note">次は神までいける。</p>
        </div>
      </section>

      <p class="sr-only" id="game-status" aria-live="polite"></p>
    </main>
    <script type="module" src="game.js?v=2"></script>
  </body>
</html>
